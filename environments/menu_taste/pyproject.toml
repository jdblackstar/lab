[project]
name = "menu-taste"
description = "Menu composition eval: pick the dish that was removed from a caterer's menu"
tags = ["single-turn", "multiple-choice", "taste", "food", "eval"]
version = "0.2.0"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "verifiers>=0.4.0",
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Only needed to build a corpus from raw files; the eval itself reads JSONL.
ingest = [
    "anthropic>=1.14",
    "pillow>=10.0",
    "pillow-heif>=0.18",
    "openpyxl>=3.1",
    "striprtf>=0.0.26",
]
dev = [
    "pytest>=8.0.0",
    "menu-taste[ingest]",
    "aiohttp>=3.14.5",
]

[project.scripts]
menu-taste-ingest = "menu_taste.ingest.cli:main"
menu-taste-baselines = "menu_taste.baselines:main"
menu-taste-questions = "menu_taste.questions:main"
menu-taste-score = "menu_taste.scoring:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["menu_taste"]

[tool.hatch.build.targets.sdist]
include = ["menu_taste/**/*.py", "menu_taste/data/*.jsonl", "pyproject.toml", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
