[project]
name = "dbt-debugger"
description = "dbt-native pipeline debugging benchmark (scenario corpus + verifiers v1 taskset)"
version = "0.2.0"
requires-python = ">=3.11"
readme = "README.md"
tags = ["multi-turn", "tool-use", "dbt", "analytics", "eval"]
dependencies = [
    "verifiers>=0.4.0",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "duckdb>=1.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbt_debugger"]

[tool.hatch.build.targets.sdist]
include = [
    "dbt_debugger/**/*.py",
    "dbt_debugger/scenarios/**/*.json",
    "pyproject.toml",
    "README.md",
    "spec/**/*.md",
    "validation/**/*.md",
    "validation/**/*.json",
    "validation/**/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
