# GEPA over menu-taste, which sets Task.system_prompt for GEPA to optimize.
# Run from the environment project (the root pins legacy verifiers):
#
#   cd environments/menu_taste
#   uv run vf-gepa @ ../../configs/gepa/base.toml --dry-run
#
# Without a question set this loads the 93 bundled synthetic questions, so num_train +
# num_val stays under 93. With private questions (MENU_TASTE_QUESTIONS), pass
# `-o private/outputs` so traces stay under private/.
model = "openai/gpt-4.1-mini"
reflection_model = "openai/gpt-4.1-mini"
num_train = 60
num_val = 30
max_total_rollouts = 500
reflection_minibatch_size = 3
max_concurrent = 32
seed = 0
# reflection_columns = ["course", "target"]

[env.taskset]
id = "menu-taste"

