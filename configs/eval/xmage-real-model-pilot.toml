# Run: scripts/prime_rl_eval.sh environments/xmage_poc @ configs/eval/xmage-real-model-pilot.toml
# To compare mini, add -m openai/gpt-4.1-mini (CLI flags override this file).
# One seed × two decks × two seats × play/draw: a balanced pilot, not a win-rate estimate.
# prime-rl's `uv run eval` exits 0 even when episodes error: check that every episode in
# monitors/file/plan.json landed in monitors/file/traces/stream.index.jsonl with ok=true
# and num_errors=0. It counts pilot max_turns stops as truncated.
model = "openai/gpt-4.1-nano"
group_size = 1
# Keep run directories with the ignored environment outputs.
output_dir = "environments/xmage_poc/outputs/evals"

[concurrency]
# Games run one at a time; each launches its own JVM.
min_inflight = 1
max_inflight = 1

[sampling]
# The system prompt invites reasoning before the <answer> block; a small budget
# truncates the reply before the answer and counts as an invalid action.
max_tokens = 4096
temperature = 0.0

[env]
# Verifiers applies this to the entire game, not to each model request.
timeout.episode = 7200

[[source]]
env.taskset.id = "xmage-poc"
env.taskset.num_games = 8
env.taskset.seed = 7
env.taskset.pilot_seat = "alternate"
env.taskset.pilot_deck = "balanced"
env.taskset.pilot_play_order = "balanced"
env.opponent = "scripted"
env.history_decisions = 1
env.auto_pass_priority = true
# Privacy projections are still audited; choose full_audit for restoration checks.
env.recording_mode = "benchmark"
# Bound spend even if a model never advances the game. Truncation is not a loss.
# Invalid-reply retries count toward this cap: it bounds model attempts, not decisions.
env.pilot.max_turns = 256
