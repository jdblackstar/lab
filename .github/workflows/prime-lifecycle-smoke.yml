# Smoke-test the documented Prime CLI path and the packaged artifact path.
# The local install smoke covers ``prime env install`` from a checkout; the artifact smoke
# covers the built wheel/sdist contents; eval smoke runs only from ``main`` so PR branch
# code never receives the secret, and the shell script skips eval when PRIME_API_KEY is
# unset. The eval runs prime-rl's ``uv run eval`` (scripts/prime_rl_eval.sh), which
# requires Python 3.12.
#
# Use a project ``uv venv`` and prepend ``.venv/bin`` to PATH so ``python`` matches the
# interpreter ``prime env install`` targets (same as local dev with an activated venv).

name: Prime lifecycle smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xmage-smoke:
    name: XMage install, game, artifact, and controller isolation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - name: Install the Prime CLI and test tools
        # prime env install brings verifiers 0.4 with the environment; evals use prime-rl's
        # `uv run eval`, which scripts/prime_rl_eval.sh sets up in its own cached venv.
        run: |
          uv venv --python 3.12
          uv pip install 'prime==0.14.0' pytest
      - name: Run XMage lifecycle smoke (local scripted controller)
        run: bash scripts/ci/smoke_xmage_poc.sh

  orb-setup-smoke:
    name: orb setup + later login shell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Test fresh setup and warm reruns without tool bin on PATH
        run: bash scripts/ci/smoke_orb_setup.sh

  install-smoke:
    name: prime env install + vf-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Create venv and install Prime CLI
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install prime

      - name: Run local Prime lifecycle smoke
        run: bash scripts/smoke_prime_lifecycle.sh

  artifact-smoke:
    name: packaged artifact install + vf-validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Run packaged artifact smoke
        run: bash scripts/smoke_prime_artifact.sh

  eval-smoke:
    name: prime-rl eval (minimal)
    needs:
      - install-smoke
      - artifact-smoke
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v4

      - name: Create venv and install Prime CLI
        run: |
          uv venv --python 3.12
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          uv pip install prime

      - name: Run Prime lifecycle smoke with eval
        env:
          PRIME_API_KEY: ${{ secrets.PRIME_API_KEY }}
        run: bash scripts/smoke_prime_lifecycle.sh
