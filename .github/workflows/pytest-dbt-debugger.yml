# Run unit tests for the dbt-debugger environment on every PR and push to main.

name: pytest (dbt-debugger)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: environments/dbt_debugger/uv.lock

      - name: Install dev deps and run tests
        working-directory: environments/dbt_debugger
        run: |
          uv sync --extra dev
          uv run pytest tests/ -q
